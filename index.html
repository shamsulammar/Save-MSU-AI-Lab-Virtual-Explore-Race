<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVE MSU AI LAB — Cyber Investigator Mission</title>
<style>
  :root{
    --bg:#05060f;
    --bg2:#0a0e1f;
    --cyan:#3ef0ff;
    --blue:#4d7dff;
    --purple:#a855f7;
    --pink:#ff3ec9;
    --green:#39ff88;
    --red:#ff3b5c;
    --text:#dbe7ff;
    --dim:#7f8bb3;
    --panel:rgba(15,20,40,0.72);
    --border:rgba(62,240,255,0.28);
    --font-display:'Orbitron', 'Segoe UI', sans-serif;
    --font-mono:'Share Tech Mono','Consolas',monospace;
  }
  @font-face{
    font-family:'Orbitron';
    src:local('Orbitron');
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-mono);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* animated grid background */
  #bgcanvas{
    position:fixed; inset:0; z-index:0; opacity:0.55;
  }
  .scanlines{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  }
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
  }
  #app{ position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 60px;}

  h1,h2,h3{font-family:var(--font-display), var(--font-mono); letter-spacing:2px;}

  /* HUD */
  #hud{
    width:100%; max-width:900px; display:flex; justify-content:space-between; align-items:center;
    gap:12px; flex-wrap:wrap; padding:12px 18px; margin-bottom:22px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 0 24px rgba(62,240,255,0.08);
    display:none;
  }
  #hud.show{display:flex;}
  .hud-item{display:flex; flex-direction:column; align-items:center; min-width:70px;}
  .hud-label{font-size:10px; color:var(--dim); letter-spacing:1.5px;}
  .hud-value{font-family:var(--font-display); font-size:18px; color:var(--cyan); text-shadow:0 0 10px rgba(62,240,255,0.6);}
  .hud-value.warn{color:var(--red); text-shadow:0 0 10px rgba(255,59,92,0.7); animation:pulse 1s infinite;}
  .lives{display:flex; gap:4px; font-size:16px;}
  #progressWrap{width:100%; max-width:900px; height:8px; background:rgba(255,255,255,0.06); border-radius:6px; overflow:hidden; margin-bottom:22px; display:none; border:1px solid var(--border);}
  #progressWrap.show{display:block;}
  #progressBar{height:100%; width:0%; background:linear-gradient(90deg,var(--blue),var(--cyan),var(--purple)); box-shadow:0 0 14px var(--cyan); transition:width .5s ease;}

  .panel{
    width:100%; max-width:760px; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:32px; box-shadow:0 0 40px rgba(62,240,255,0.08), inset 0 0 60px rgba(80,60,180,0.05);
    position:relative; overflow:hidden;
  }
  .panel::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
    animation:sweep 3s linear infinite;
  }
  @keyframes sweep{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}

  .eyebrow{color:var(--purple); font-size:12px; letter-spacing:4px; margin-bottom:8px;}
  .title-glow{color:var(--cyan); text-shadow:0 0 12px rgba(62,240,255,0.7), 0 0 30px rgba(62,240,255,0.3);}

  /* Loading screen */
  #screen-loading{ text-align:center; padding:60px 20px;}
  .loader-bar{width:280px; height:6px; background:rgba(255,255,255,0.08); border-radius:4px; margin:26px auto; overflow:hidden; border:1px solid var(--border);}
  .loader-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--purple)); box-shadow:0 0 12px var(--cyan);}
  .blink{animation:blink 1s step-start infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* Briefing */
  #typewriter{font-size:15px; line-height:1.8; color:var(--text); min-height:220px; white-space:pre-wrap;}
  .cursor{display:inline-block; width:8px; background:var(--cyan); animation:blink 0.8s step-start infinite;}

  /* Challenge */
  .layer-tag{font-size:12px; color:var(--purple); letter-spacing:3px; margin-bottom:6px;}
  .difficulty{display:inline-block; font-size:11px; padding:3px 10px; border-radius:20px; margin-left:8px; letter-spacing:1px; vertical-align:middle;}
  .diff-easy{background:rgba(57,255,136,0.15); color:var(--green); border:1px solid var(--green);}
  .diff-medium{background:rgba(255,214,10,0.15); color:#ffd60a; border:1px solid #ffd60a;}
  .diff-hard{background:rgba(255,59,92,0.15); color:var(--red); border:1px solid var(--red);}
  .room-title{font-size:26px; margin-bottom:14px;}
  .story-text{color:var(--dim); font-size:14px; line-height:1.7; margin-bottom:18px;}
  .challenge-box{background:rgba(0,0,0,0.35); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:18px;}
  .code-block{background:#02030a; border-left:3px solid var(--cyan); padding:14px; font-family:var(--font-mono); font-size:14px; color:var(--green); border-radius:4px; margin:10px 0; white-space:pre;}
  .puzzle-text{font-size:20px; letter-spacing:3px; color:var(--cyan); text-align:center; margin:14px 0; text-shadow:0 0 10px rgba(62,240,255,0.5);}
  input[type=text]{
    width:100%; padding:14px 16px; background:#02030a; border:1px solid var(--border); border-radius:8px;
    color:var(--cyan); font-family:var(--font-mono); font-size:16px; letter-spacing:2px; text-transform:uppercase;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--cyan); box-shadow:0 0 12px rgba(62,240,255,0.4);}
  .btn-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  button{
    font-family:var(--font-mono); font-size:13px; letter-spacing:1.5px; padding:12px 22px; border-radius:8px;
    border:1px solid var(--cyan); background:rgba(62,240,255,0.08); color:var(--cyan); cursor:pointer;
    transition:all .2s ease; text-transform:uppercase;
  }
  button:hover{background:rgba(62,240,255,0.22); box-shadow:0 0 16px rgba(62,240,255,0.5); transform:translateY(-1px);}
  button:active{transform:translateY(0);}
  button.primary{background:linear-gradient(90deg,var(--blue),var(--purple)); border:none; color:#fff;}
  button.primary:hover{box-shadow:0 0 20px rgba(168,85,247,0.6);}
  button.ghost{border-color:var(--dim); color:var(--dim); background:transparent;}
  button.ghost:hover{border-color:var(--cyan); color:var(--cyan); box-shadow:none;}
  button:disabled{opacity:0.35; cursor:not-allowed; box-shadow:none; transform:none;}

  .mcq-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  @media (max-width:520px){.mcq-grid{grid-template-columns:1fr;}}
  .mcq-option{
    padding:14px; border:1px solid var(--border); border-radius:8px; background:rgba(0,0,0,0.3);
    cursor:pointer; text-align:center; font-size:14px; transition:all .15s ease;
  }
  .mcq-option:hover{border-color:var(--cyan); background:rgba(62,240,255,0.08);}
  .mcq-option.selected{border-color:var(--purple); background:rgba(168,85,247,0.18); box-shadow:0 0 12px rgba(168,85,247,0.4);}

  .sign-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px;}
  .sign{background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:10px; padding:10px; cursor:pointer; text-align:center; transition:all .15s ease;}
  .sign:hover{border-color:var(--cyan); box-shadow:0 0 12px rgba(62,240,255,0.35);}
  .sign svg{width:70px; height:70px;}
  .sign-label{font-size:10px; color:var(--dim); margin-top:6px; letter-spacing:1px;}

  .hint-text{margin-top:14px; padding:12px 14px; background:rgba(168,85,247,0.1); border:1px solid var(--purple); border-radius:8px; color:#e6d4ff; font-size:13px; display:none;}
  .hint-text.show{display:block;}

  .feedback{margin-top:16px; padding:14px 18px; border-radius:8px; font-size:14px; letter-spacing:1px; display:none; text-align:center; font-family:var(--font-display), var(--font-mono);}
  .feedback.correct{display:block; background:rgba(57,255,136,0.12); border:1px solid var(--green); color:var(--green); animation:fadeGlow .6s ease;}
  .feedback.wrong{display:block; background:rgba(255,59,92,0.12); border:1px solid var(--red); color:var(--red); animation:shake .4s ease;}
  @keyframes fadeGlow{from{opacity:0; transform:scale(0.96);}to{opacity:1; transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}

  .memory-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px;}
  .mem-tile{aspect-ratio:1; background:rgba(0,0,0,0.35); border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; user-select:none;}
  .mem-tile.locked{cursor:default; opacity:0.4;}
  .mem-tile.correct{border-color:var(--green); background:rgba(57,255,136,0.12);}
  .mem-tile.wrong{border-color:var(--red); background:rgba(255,59,92,0.12);}

  .key-preview{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
  .key-chip{padding:6px 12px; background:rgba(62,240,255,0.08); border:1px solid var(--cyan); border-radius:20px; font-size:12px; color:var(--cyan);}

  #inventory{width:100%; max-width:900px; display:none; margin-bottom:16px;}
  #inventory.show{display:block;}
  .inv-title{font-size:11px; color:var(--dim); letter-spacing:2px; margin-bottom:8px;}
  .inv-keys{display:flex; gap:8px; flex-wrap:wrap;}
  .inv-key{width:34px; height:34px; border-radius:8px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:13px; background:rgba(0,0,0,0.3); color:var(--dim);}
  .inv-key.got{border-color:var(--cyan); color:var(--cyan); background:rgba(62,240,255,0.12); box-shadow:0 0 10px rgba(62,240,255,0.3);}

  /* Mission complete */
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:24px 0;}
  @media(max-width:560px){.stat-grid{grid-template-columns:1fr;}}
  .stat-box{background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:10px; padding:18px; text-align:center;}
  .stat-num{font-family:var(--font-display); font-size:28px; color:var(--cyan); text-shadow:0 0 12px rgba(62,240,255,0.6);}
  .stat-lbl{font-size:11px; color:var(--dim); letter-spacing:1.5px; margin-top:4px;}
  .rank-badge{font-family:var(--font-display); font-size:20px; color:var(--purple); text-align:center; margin:10px 0; text-shadow:0 0 14px rgba(168,85,247,0.6);}

  .badge-row{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}
  .badge{padding:8px 14px; border-radius:20px; font-size:12px; border:1px solid var(--purple); background:rgba(168,85,247,0.1); color:#e6d4ff;}

  #leaderboard-list{margin-top:10px;}
  .lb-row{display:flex; justify-content:space-between; padding:8px 12px; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13px;}
  .lb-row:first-child{color:#ffd60a;}

  .confetti-piece{position:fixed; top:-10px; z-index:50; pointer-events:none; border-radius:2px;}

  footer{margin-top:30px; font-size:11px; color:var(--dim); text-align:center; letter-spacing:1px;}
  a{color:var(--cyan);}

  .briefing-list{margin:16px 0; padding-left:0; list-style:none;}
  .briefing-list li{padding:8px 0 8px 26px; position:relative; font-size:14px; color:var(--text); border-bottom:1px solid rgba(255,255,255,0.05);}
  .briefing-list li::before{content:'▹'; position:absolute; left:0; color:var(--cyan);}

  .op-select{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .op-card{padding:14px 16px; border:1px solid var(--border); border-radius:8px; cursor:pointer; background:rgba(0,0,0,0.25);}
  .op-card:hover{border-color:var(--cyan);}
  .op-card.active{border-color:var(--purple); background:rgba(168,85,247,0.12);}
</style>
</head>
<body>
<canvas id="bgcanvas"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<div id="app">

  <div id="hud">
    <div class="hud-item"><span class="hud-label">TIME LEFT</span><span class="hud-value" id="hudTime">60:00</span></div>
    <div class="hud-item"><span class="hud-label">SCORE</span><span class="hud-value" id="hudScore">0</span></div>
    <div class="hud-item"><span class="hud-label">LIVES</span><span class="hud-value lives" id="hudLives">❤❤❤</span></div>
    <div class="hud-item"><span class="hud-label">HINTS LEFT</span><span class="hud-value" id="hudHints">3</span></div>
    <div class="hud-item"><span class="hud-label">LAYER</span><span class="hud-value" id="hudLayer">0/10</span></div>
  </div>

  <div id="progressWrap"><div id="progressBar"></div></div>

  <div id="inventory">
    <div class="inv-title">AI CORE KEYS</div>
    <div class="inv-keys" id="invKeys"></div>
  </div>

  <div id="screen-root" class="panel"></div>

  <footer>SAVE MSU AI LAB &middot; MSU Cyber Investigator Programme &middot; Team code required to join a hosted race</footer>
</div>

<script>
/* ============================================================
   SAVE MSU AI LAB — single-file escape room game
   Deploy: push this file as index.html to a GitHub repo, then
   enable GitHub Pages (Settings > Pages > root branch).
   ============================================================ */

// ---------- background grid animation ----------
(function(){
  const c = document.getElementById('bgcanvas');
  const ctx = c.getContext('2d');
  let w,h;
  function resize(){ w=c.width=window.innerWidth; h=c.height=window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const nodes = Array.from({length:60}, ()=>({
    x:Math.random()*w, y:Math.random()*h,
    vx:(Math.random()-0.5)*0.25, vy:(Math.random()-0.5)*0.25
  }));
  function tick(){
    ctx.fillStyle='rgba(5,6,15,0.35)';
    ctx.fillRect(0,0,w,h);
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy;
      if(n.x<0||n.x>w) n.vx*=-1;
      if(n.y<0||n.y>h) n.vy*=-1;
    });
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<130){
          ctx.strokeStyle=`rgba(62,240,255,${0.12*(1-d/130)})`;
          ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke();
        }
      }
      ctx.fillStyle='rgba(168,85,247,0.6)';
      ctx.beginPath(); ctx.arc(nodes[i].x,nodes[i].y,1.6,0,Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

// ---------- state ----------
const SAVE_KEY = 'smal_progress_v1';
const LB_KEY = 'smal_leaderboard_v1';
const TOTAL_TIME = 60*60; // seconds

let state = {
  teamName: '',
  layerIndex: -1, // -1 = not started
  score: 0,
  lives: 3,
  hintsLeft: 3,
  keys: [], // collected key letters/values indexed by layer
  achievements: [],
  timeRemaining: TOTAL_TIME,
  started: false,
  finished: false
};

let timerHandle = null;

function saveProgress(){
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}
function loadProgress(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
function clearProgress(){
  localStorage.removeItem(SAVE_KEY);
}

// ---------- challenge data ----------
const CHALLENGES = [
  {
    room:'Computer Lab', difficulty:'easy', points:100,
    story:"You enter the Computer Laboratory. The login terminal is still active, flickering under emergency lighting. Someone erased half the password before they were dragged away.",
    type:'text',
    prompt:'Unscramble the letters to find the missing password:',
    puzzle:'P U T E R C O M',
    answer:'COMPUTER',
    hint:"Think about the room you're standing in right now.",
    key:'N'
  },
  {
    room:'Robotics Room', difficulty:'easy', points:100,
    story:"A dormant service robot powers on as you pass. Its optical sensor locks onto you and it recites a riddle in a flat synthetic voice.",
    type:'text',
    prompt:'"I have many keys, but no locks. What am I?"',
    puzzle:null,
    answer:'KEYBOARD',
    hint:'Every computer has one, and you are using one right now.',
    key:'O'
  },
  {
    room:'Server Room', difficulty:'easy', points:100,
    story:"Rows of blinking server racks hum around you. Cables snake across the floor, all converging on one unlabeled device.",
    type:'mcq',
    prompt:'Which device connects multiple computers on a LAN?',
    options:['Printer','Switch','Speaker','Scanner'],
    answer:'Switch',
    hint:'It operates at the data link layer and forwards frames between devices.',
    key:'V'
  },
  {
    room:'AI Research Room', difficulty:'medium', points:200,
    story:"A whiteboard covered in equations faces a terminal running NOVA's last known process. It printed a sequence before it froze.",
    type:'text',
    prompt:'Complete the sequence:',
    puzzle:'2, 4, 8, 16, 32, ?',
    answer:'64',
    hint:'Each number is double the one before it.',
    key:'A'
  },
  {
    room:'Digital Forensics Room', difficulty:'medium', points:200,
    story:"An evidence locker holds a single decrypted note. It was encoded with a simple substitution cipher used across MSU's old security training modules.",
    type:'text',
    prompt:'Decode this Caesar cipher (each letter shifted +3):',
    puzzle:'KHOOR',
    answer:'HELLO',
    hint:'Shift each letter back by 3 positions in the alphabet.',
    key:'2'
  },
  {
    room:'Computer Vision Room', difficulty:'medium', points:200,
    story:"A bank of monitors cycles through dashcam footage NOVA was trained on. One frame is paused, waiting for your input.",
    type:'sign',
    prompt:'Click the sign that means STOP.',
    hint:'It is a red octagon.',
    key:'0'
  },
  {
    room:'Programming Room', difficulty:'medium', points:200,
    story:"A code editor is open mid-debug. NOVA left one function running before the breach cut it off.",
    type:'text',
    prompt:'What does this code print?',
    puzzle:'x = 5\ny = 10\nprint(x + y)',
    answer:'15',
    hint:'Add the two variables together.',
    key:'2'
  },
  {
    room:'Cybersecurity Room', difficulty:'hard', points:300,
    story:"Three sealed doors stand before you, each labeled by ShadowByte with what lies behind it: Door A conceals Fire. Door B conceals Hackers. Door C conceals the AI Core. A note is taped beside them.",
    type:'mcq',
    prompt:'The note reads: "The AI Core is NOT behind Door B." Which door do you open?',
    options:['Door A','Door B','Door C'],
    answer:'Door C',
    hint:'The labels already tell you what is behind each door — read them again.',
    key:'6'
  },
  {
    room:'Machine Learning Core', difficulty:'hard', points:300,
    story:"A holographic memory-training module activates. It flashes a sequence of symbols once, then hides them. Recall the sequence to proceed.",
    type:'memory',
    prompt:'Memorize the highlighted order, then repeat it by clicking the tiles in the same sequence.',
    hint:'The sequence follows the tile numbers in reading order: top-left to bottom-right.',
    key:'!'
  },
  {
    room:'NOVA Core', difficulty:'hard', points:300,
    story:"You stand before NOVA's restoration console. All nine AI Core Keys you have collected now need to be arranged into the final restoration code.",
    type:'final',
    prompt:'Enter the restoration code using the keys you collected, in order:',
    answer:'NOVA2026!',
    hint:'Read your collected keys from Layer 1 to Layer 9 in order, then add the final key.',
    key:'?'
  }
];

// ---------- helpers ----------
function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}
function normalize(str){
  return str.trim().toUpperCase().replace(/\s+/g,'');
}
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}
function render(html){
  document.getElementById('screen-root').innerHTML = html;
}
function updateHud(){
  const hud = document.getElementById('hud');
  const progWrap = document.getElementById('progressWrap');
  const inv = document.getElementById('inventory');
  if(state.started && !state.finished){
    hud.classList.add('show'); progWrap.classList.add('show'); inv.classList.add('show');
  } else {
    hud.classList.remove('show'); progWrap.classList.remove('show'); inv.classList.remove('show');
  }
  document.getElementById('hudTime').textContent = fmtTime(state.timeRemaining);
  document.getElementById('hudTime').className = 'hud-value' + (state.timeRemaining<=300 ? ' warn' : '');
  document.getElementById('hudScore').textContent = state.score;
  document.getElementById('hudLives').textContent = '❤'.repeat(state.lives) + '🖤'.repeat(3-state.lives);
  document.getElementById('hudHints').textContent = state.hintsLeft;
  document.getElementById('hudLayer').textContent = `${Math.max(state.layerIndex+1,0)}/10`;
  document.getElementById('progressBar').style.width = `${Math.max(state.layerIndex,0)/10*100}%`;

  const invKeys = document.getElementById('invKeys');
  invKeys.innerHTML = CHALLENGES.map((c,i)=>{
    const got = i < state.keys.length;
    return `<div class="inv-key ${got?'got':''}">${got ? state.keys[i] : (i+1)}</div>`;
  }).join('');
}

// ---------- timer ----------
function startTimer(){
  if(timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    if(state.finished){ clearInterval(timerHandle); return; }
    state.timeRemaining--;
    if(state.timeRemaining<=0){
      state.timeRemaining = 0;
      clearInterval(timerHandle);
      endMission(false);
    }
    updateHud();
    saveProgress();
  },1000);
}

// ---------- screens ----------
function showLoading(){
  render(`
    <div id="screen-loading">
      <div class="eyebrow">MSU CYBER INVESTIGATOR PROGRAMME</div>
      <h1 class="title-glow" style="font-size:22px;">CONNECTING TO MSU AI LAB<span class="blink">_</span></h1>
      <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
      <div style="color:var(--dim); font-size:12px; letter-spacing:1px;" id="loaderStatus">Establishing secure uplink...</div>
    </div>
  `);

  const status = document.getElementById('loaderStatus');
  const msgs = ['Establishing secure uplink...','Bypassing ShadowByte firewall...','Decrypting lab schematics...','Loading NOVA core fragments...','Connection stable.'];

    pct += Math.random()*18+8;
    if(pct>100) pct=100;

      setTimeout(showEntry, 500);
    }

}

    <h1 class="title-glow" style="font-size:30px; margin-bottom:6px;">SAVE MSU AI LAB</h1>

function showBriefing(){
  updateHud();
  const briefingText =
`ALERT!
08:30 AM
MSU ARTIFICIAL INTELLIGENCE LABORATORY

An unknown hacker group known as ShadowByte has breached the AI Laboratory.

The laboratory's experimental AI, NOVA, has been split into ten encrypted security layers.

Every layer contains one AI Core Key. Without all ten keys, NOVA cannot be restored.

The hackers left only puzzles behind.

You have 60 minutes.

Good luck, Investigator ${state.teamName}.`;

  render(`
    <div class="eyebrow">MISSION BRIEFING</div>
    <h2 class="title-glow" style="margin-bottom:16px;">INCOMING TRANSMISSION</h2>
    <div class="challenge-box">
      <div id="typewriter"></div>
    </div>
    <div class="btn-row">
      <button class="primary" id="btnEnter" style="display:none;">Enter Security Layer 1 ▶</button>
      <button class="ghost" id="btnSkip">Skip Animation</button>
    </div>
  `);
  const tw = document.getElementById('typewriter');
  let i = 0;
  function type(){
    if(i <= briefingText.length){
      tw.innerHTML = briefingText.slice(0,i).replace(/\n/g,'<br>') + '<span class="cursor">&nbsp;</span>';
      i += 2;
      requestAnimationFrame(()=>setTimeout(type, 12));
    } else {
      document.getElementById('btnEnter').style.display = 'inline-block';
    }
  }
  type();
  document.getElementById('btnSkip').onclick = ()=>{
    i = briefingText.length + 1;
    tw.innerHTML = briefingText.replace(/\n/g,'<br>');
    document.getElementById('btnEnter').style.display = 'inline-block';
  };
  document.getElementById('btnEnter').onclick = ()=>{
    startTimer();
    showLayer(0);
  };
}

let currentHintShown = false;
let mcqSelected = null;
let memorySequence = [];
let memoryPlayerInput = [];

function diffClass(d){ return d==='easy' ? 'diff-easy' : d==='medium' ? 'diff-medium' : 'diff-hard'; }

function showLayer(idx){
  state.layerIndex = idx;
  currentHintShown = false;
  mcqSelected = null;
  saveProgress();
  updateHud();
  const ch = CHALLENGES[idx];

  let bodyHtml = '';
  if(ch.type === 'text'){
    bodyHtml = `
      ${ch.puzzle ? `<div class="${ch.puzzle.includes('\n') ? 'code-block' : 'puzzle-text'}">${ch.puzzle}</div>` : ''}
      <p style="margin-bottom:10px; color:var(--text);">${ch.prompt}</p>
      <input type="text" id="answerInput" placeholder="Enter your answer" autocomplete="off">
    `;
  } else if(ch.type === 'mcq'){
    bodyHtml = `
      <p style="margin-bottom:6px; color:var(--text);">${ch.prompt}</p>
      <div class="mcq-grid" id="mcqGrid">
        ${shuffle([...ch.options]).map(opt=>`<div class="mcq-option" data-val="${opt}">${opt}</div>`).join('')}
      </div>
    `;
  } else if(ch.type === 'sign'){
    bodyHtml = `
      <p style="margin-bottom:6px; color:var(--text);">${ch.prompt}</p>
      <div class="sign-grid" id="signGrid">
        ${signOptions().map(s=>`
          <div class="sign" data-val="${s.name}">
            ${s.svg}
            <div class="sign-label">${s.name}</div>
          </div>`).join('')}
      </div>
    `;
  } else if(ch.type === 'memory'){
    memorySequence = generateMemorySequence();
    memoryPlayerInput = [];
    bodyHtml = `
      <p style="margin-bottom:10px; color:var(--text);">${ch.prompt}</p>
      <div class="memory-grid" id="memGrid">
        ${memorySequence.map((v,i)=>`<div class="mem-tile locked" data-idx="${i}">?</div>`).join('')}
      </div>
      <div style="margin-top:10px; font-size:12px; color:var(--dim);" id="memStatus">Memorize the flashing sequence...</div>
    `;
  } else if(ch.type === 'final'){
    bodyHtml = `
      <div class="key-preview">
        ${state.keys.map((k,i)=>`<div class="key-chip">K${i+1} = ${k}</div>`).join('')}
      </div>
      <p style="margin:16px 0 10px; color:var(--text);">${ch.prompt}</p>
      <input type="text" id="answerInput" placeholder="Enter the restoration code" autocomplete="off">
    `;
  }

  render(`
    <div class="layer-tag">SECURITY LAYER ${idx+1} / 10 <span class="difficulty ${diffClass(ch.difficulty)}">${ch.difficulty.toUpperCase()} · ${ch.points} PTS</span></div>
    <h2 class="room-title title-glow">${ch.room}</h2>
    <p class="story-text">${ch.story}</p>
    <div class="challenge-box" id="challengeBody">
      ${bodyHtml}
    </div>
    <div class="hint-text" id="hintText">${ch.hint}</div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-row">
      ${ch.type==='text' || ch.type==='final' ? '<button class="primary" id="btnSubmit">Submit ▶</button>' : ''}
      <button class="ghost" id="btnHint" ${state.hintsLeft<=0 ? 'disabled':''}>💡 Use Hint (-30 pts, ${state.hintsLeft} left)</button>
      <button class="ghost" id="btnSave">💾 Save & Exit</button>
    </div>
  `);

  wireLayerInteractions(ch, idx);
}

function wireLayerInteractions(ch, idx){
  document.getElementById('btnHint').onclick = ()=>{
    if(state.hintsLeft<=0) return;
    state.hintsLeft--;
    state.score = Math.max(0, state.score - 30);
    currentHintShown = true;
    document.getElementById('hintText').classList.add('show');
    updateHud(); saveProgress();
    document.getElementById('btnHint').disabled = true;
    document.getElementById('btnHint').textContent = `💡 Hint used`;
  };
  document.getElementById('btnSave').onclick = ()=>{
    saveProgress();
    alert('Progress saved. You can close this tab and resume later from this browser.');
  };

  if(ch.type==='text' || ch.type==='final'){
    const input = document.getElementById('answerInput');
    document.getElementById('btnSubmit').onclick = ()=> checkAnswer(ch, idx, input.value);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') checkAnswer(ch, idx, input.value); });
    input.focus();
  }

  if(ch.type==='mcq'){
    document.querySelectorAll('#mcqGrid .mcq-option').forEach(opt=>{
      opt.onclick = ()=>{
        document.querySelectorAll('#mcqGrid .mcq-option').forEach(o=>o.classList.remove('selected'));
        opt.classList.add('selected');
        mcqSelected = opt.dataset.val;
        setTimeout(()=>checkAnswer(ch, idx, mcqSelected), 250);
      };
    });
  }

  if(ch.type==='sign'){
    document.querySelectorAll('#signGrid .sign').forEach(s=>{
      s.onclick = ()=> checkAnswer(ch, idx, s.dataset.val);
    });
  }

  if(ch.type==='memory'){
    runMemoryFlash(ch, idx);
  }
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function signOptions(){
  const stop = {name:'STOP', svg:`<svg viewBox="0 0 100 100"><polygon points="30,5 70,5 95,30 95,70 70,95 30,95 5,70 5,30" fill="#c8102e" stroke="#fff" stroke-width="3"/><text x="50" y="58" font-size="20" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">STOP</text></svg>`};
  const yield_ = {name:'YIELD', svg:`<svg viewBox="0 0 100 100"><polygon points="50,10 90,85 10,85" fill="#fff" stroke="#c8102e" stroke-width="6"/></svg>`};
  const speed = {name:'SPEED LIMIT', svg:`<svg viewBox="0 0 100 100"><rect x="15" y="10" width="70" height="80" rx="6" fill="#fff" stroke="#111" stroke-width="4"/><text x="50" y="58" font-size="24" fill="#111" text-anchor="middle" font-family="Arial" font-weight="bold">60</text></svg>`};
  const noEntry = {name:'NO ENTRY', svg:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#c8102e" stroke="#fff" stroke-width="4"/><rect x="20" y="42" width="60" height="16" fill="#fff"/></svg>`};
  const pedestrian = {name:'PEDESTRIAN', svg:`<svg viewBox="0 0 100 100"><polygon points="50,8 92,88 8,88" fill="#ffd400" stroke="#111" stroke-width="4"/><circle cx="50" cy="50" r="6" fill="#111"/><line x1="50" y1="56" x2="50" y2="72" stroke="#111" stroke-width="4"/><line x1="50" y1="60" x2="40" y2="70" stroke="#111" stroke-width="4"/><line x1="50" y1="60" x2="60" y2="70" stroke="#111" stroke-width="4"/></svg>`};
  const roundabout = {name:'ROUNDABOUT', svg:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#0057b8" stroke-width="6"/><path d="M50 30 A20 20 0 1 1 30 50" fill="none" stroke="#0057b8" stroke-width="6"/><polygon points="30,50 22,44 22,56" fill="#0057b8"/></svg>`};
  return shuffle([stop, yield_, speed, noEntry, pedestrian, roundabout]);
}

function generateMemorySequence(){
  const len = 5;
  const seq = [];
  while(seq.length < len){
    const n = Math.floor(Math.random()*8);
    if(!seq.includes(n)) seq.push(n);
  }
  return seq;
}

function runMemoryFlash(ch, idx){
  const tiles = [...document.querySelectorAll('#memGrid .mem-tile')];
  let i = 0;
  const status = document.getElementById('memStatus');
  function flashNext(){
    if(i>0) tiles[memorySequence[i-1]].classList.remove('correct');
    if(i < memorySequence.length){
      tiles[memorySequence[i]].classList.add('correct');
      tiles[memorySequence[i]].textContent = i+1;
      i++;
      setTimeout(flashNext, 800);
    } else {
      setTimeout(()=>{
        tiles.forEach(t=>{ t.classList.remove('correct'); t.textContent='?'; t.classList.remove('locked'); });
        status.textContent = 'Your turn — click the tiles in the order shown.';
        tiles.forEach(t=>{
          t.onclick = ()=>{
            const idxClicked = parseInt(t.dataset.idx);
            memoryPlayerInput.push(idxClicked);
            const step = memoryPlayerInput.length - 1;
            if(memorySequence[step] === idxClicked){
              t.classList.add('correct');
              t.textContent = memoryPlayerInput.length;
              if(memoryPlayerInput.length === memorySequence.length){
                tiles.forEach(tt=>tt.onclick=null);
                setTimeout(()=>checkAnswer(ch, idx, 'CORRECT_MEMORY_SEQUENCE', true), 300);
              }
            } else {
              t.classList.add('wrong');
              tiles.forEach(tt=>tt.onclick=null);
              setTimeout(()=>checkAnswer(ch, idx, 'WRONG', false, true), 300);
            }
          };
        });
      }, 700);
    }
  }
  setTimeout(flashNext, 900);
}

function checkAnswer(ch, idx, rawValue, forceCorrect, forceWrong){
  let isCorrect;
  if(forceCorrect){ isCorrect = true; }
  else if(forceWrong){ isCorrect = false; }
  else if(ch.type==='mcq' || ch.type==='sign'){ isCorrect = rawValue === ch.answer; }
  else { isCorrect = normalize(rawValue) === normalize(ch.answer); }

  const fb = document.getElementById('feedback');

  if(isCorrect){
    let pts = ch.points;
    state.score += pts;
    state.keys.push(ch.key);
    fb.className = 'feedback correct';
    fb.innerHTML = `✅ ACCESS GRANTED — AI KEY ${idx+1} OBTAINED (+${pts} pts)`;
    checkAchievements(idx);
    saveProgress(); updateHud();
    disableLayerInputs();
    setTimeout(()=>{
      if(idx+1 < CHALLENGES.length){
        showLayer(idx+1);
      } else {
        endMission(true);
      }
    }, 1200);
  } else {
    state.score = Math.max(0, state.score - 20);
    state.lives -= 1;
    fb.className = 'feedback wrong';
    fb.innerHTML = `❌ ACCESS DENIED — incorrect response (-20 pts)`;
    saveProgress(); updateHud();
    const box = document.getElementById('challengeBody');
    box.style.animation = 'none';
    requestAnimationFrame(()=>{ box.style.animation = 'shake 0.4s ease'; });
    if(state.lives <= 0){
      setTimeout(()=>endMission(false), 1000);
    }
  }
}

function disableLayerInputs(){
  document.querySelectorAll('#challengeBody input, #challengeBody .mcq-option, #challengeBody .sign, #btnSubmit, #btnHint').forEach(elm=>{
    elm.style.pointerEvents = 'none';
    elm.disabled = true;
  });
}

function checkAchievements(idx){
  const ach = [];
  if(idx===2 && !state.achievements.includes('Puzzle Solver')) ach.push('🧩 Puzzle Solver');
  if(idx===6 && !state.achievements.includes('Cyber Detective')) ach.push('🕵️ Cyber Detective');
  if(idx===8 && !state.achievements.includes('AI Guardian')) ach.push('🤖 AI Guardian');
  if(idx===9 && !state.achievements.includes('NOVA Protector')) ach.push('🏆 NOVA Protector');
  ach.forEach(a=>state.achievements.push(a));
}

function endMission(success){
  state.finished = true;
  if(timerHandle) clearInterval(timerHandle);
  saveProgress();
  updateHud();

  const timeUsed = TOTAL_TIME - state.timeRemaining;
  const rank = rankFor(state.score, success);

  if(success) launchConfetti();

  saveToLeaderboard(state.teamName, state.score, timeUsed, success);

  render(`
    <div class="eyebrow">${success ? 'MISSION COMPLETE' : 'MISSION FAILED'}</div>
    <h1 class="title-glow" style="font-size:26px; margin-bottom:6px;">${success ? 'NOVA HAS BEEN RESTORED' : 'NOVA REMAINS OFFLINE'}</h1>
    <p style="color:var(--dim); font-size:13px; margin-bottom:6px;">Cyber Investigator: ${state.teamName}</p>
    <div class="rank-badge">RANK: ${rank}</div>

    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">${state.score}</div><div class="stat-lbl">FINAL SCORE</div></div>
      <div class="stat-box"><div class="stat-num">${fmtTime(timeUsed)}</div><div class="stat-lbl">COMPLETION TIME</div></div>
      <div class="stat-box"><div class="stat-num">${state.keys.length}/10</div><div class="stat-lbl">AI KEYS RECOVERED</div></div>
    </div>

    ${state.achievements.length ? `
    <div class="inv-title">ACHIEVEMENTS UNLOCKED</div>
    <div class="badge-row">${state.achievements.map(a=>`<div class="badge">${a}</div>`).join('')}</div>` : ''}

    <div class="challenge-box" style="margin-top:20px;">
      <div class="inv-title">LEADERBOARD (this device)</div>
      <div id="leaderboard-list">${renderLeaderboardRows()}</div>
    </div>

    <div class="btn-row">
      <button class="primary" id="btnRestart">▶ Run Again</button>
      <button class="ghost" id="btnClear">Clear Saved Progress</button>
    </div>
  `);

  document.getElementById('btnRestart').onclick = ()=>{ clearProgress(); showEntry(); };
  document.getElementById('btnClear').onclick = ()=>{ clearProgress(); alert('Saved progress cleared.'); };
}

function rankFor(score, success){
  if(!success) return 'INCOMPLETE';
  if(score >= 1900) return 'S — NOVA PROTECTOR';
  if(score >= 1500) return 'A — EXCELLENT';
  if(score >= 1000) return 'B — SKILLED';
  return 'C — QUALIFIED';
}

function saveToLeaderboard(name, score, timeUsed, success){
  let lb = [];
  try{ lb = JSON.parse(localStorage.getItem(LB_KEY)) || []; }catch(e){ lb = []; }
  lb.push({name, score, timeUsed, success, date:new Date().toISOString()});
  lb.sort((a,b)=> b.score - a.score || a.timeUsed - b.timeUsed);
  lb = lb.slice(0,20);
  localStorage.setItem(LB_KEY, JSON.stringify(lb));
}

function renderLeaderboardRows(){
  let lb = [];
  try{ lb = JSON.parse(localStorage.getItem(LB_KEY)) || []; }catch(e){ lb = []; }
  if(!lb.length) return `<div style="color:var(--dim); font-size:13px;">No entries yet.</div>`;
  return lb.slice(0,10).map((r,i)=>`
    <div class="lb-row">
      <span>#${i+1} ${r.name} ${r.success ? '' : '(incomplete)'}</span>
      <span>${r.score} pts &middot; ${fmtTime(r.timeUsed)}</span>
    </div>
  `).join('');
}

function showLeaderboardScreen(){
  render(`
    <div class="eyebrow">MSU CYBER INVESTIGATOR PROGRAMME</div>
    <h2 class="title-glow" style="margin-bottom:16px;">LEADERBOARD</h2>
    <div class="challenge-box">
      <div id="leaderboard-list">${renderLeaderboardRows()}</div>
    </div>
    <div class="btn-row">
      <button class="ghost" id="btnBack">← Back</button>
    </div>
  `);
  document.getElementById('btnBack').onclick = showEntry;
}

// ---------- confetti ----------
function launchConfetti(){
  const colors = ['#3ef0ff','#a855f7','#39ff88','#ff3ec9','#4d7dff'];
  for(let i=0;i<80;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.width = (6+Math.random()*6)+'px';
    p.style.height = (6+Math.random()*6)+'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.opacity = 0.9;
    document.body.appendChild(p);
    const duration = 2500 + Math.random()*2000;
    const rotate = Math.random()*720 - 360;
    p.animate([
      {transform:`translateY(0) rotate(0deg)`, opacity:1},
      {transform:`translateY(${window.innerHeight+40}px) rotate(${rotate}deg)`, opacity:0.9}
    ], {duration, easing:'cubic-bezier(.2,.6,.3,1)'});
    setTimeout(()=>p.remove(), duration+100);
  }
}

// ---------- boot ----------
updateHud();
showLoading();
